<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Pointage QR</title>

  <!-- Ouvre les connexions réseau à l'avance -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <link rel="stylesheet" href="style.css?v=3.6">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="script.js?v=3.6" defer></script>
</head>
<body>
  <div class="app-shell">
    <div class="container">

      <div class="header">
        <div class="badge">Secure Attendance</div>
        <h1>Pointage employé</h1>
      </div>

      <div class="scan-wrap">
        <div id="reader"></div>
        <div class="scan-tools">
          <button class="btn-icon" id="btn-toggle-scan" type="button">⏹ Arrêter le scan</button>
          <button class="btn-icon" id="btn-switch-camera" type="button" hidden>🔄 Changer de caméra</button>
          <span class="scan-status" id="scan-status">Initialisation de la caméra…</span>
        </div>
      </div>

      <div id="permission-info" hidden>
        <p>🔒 <strong>Caméra indisponible ou refusée.</strong><br>Utilisez le champ ci-dessous pour saisir le matricule :</p>
        <form id="manual-form" class="manual-input">
          <input type="text" id="manual-matricule" placeholder="Matricule" autocomplete="off">
          <button type="submit" class="btn btn-success" style="margin-top:0;">Valider</button>
        </form>
      </div>

      <div id="result" aria-live="polite"></div>

      <div class="footer">
        <p>Version 3.6 • Système de pointage par QR</p>
      </div>
    </div>
  </div>
</body>
</html>
